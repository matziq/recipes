<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Dubai chocolate bar with pistachio kataifi filling</title>
  <desc id="desc">An original illustration of segmented chocolate bars, one broken open to show green pistachio filling and golden kataifi strands.</desc>
  <defs>
