      <stop offset="0" stop-color="#fff3dc"/>
      <stop offset="1" stop-color="#e9c994"/>
    </linearGradient>
    <linearGradient id="chocolate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67381f"/>
      <stop offset=".5" stop-color="#3a1d12"/>
      <stop offset="1" stop-color="#1f100b"/>
    </linearGradient>
    <linearGradient id="filling" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9ca62"/>
      <stop offset="1" stop-color="#71852f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#3a1d12" flood-opacity=".22"/>
    </filter>
  </defs>
